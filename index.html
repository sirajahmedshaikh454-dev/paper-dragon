<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root { --paper: #f3eee3; --ink: #23305a; --seal: #d2412b; --dim: #7d7668; --line: rgba(35,48,90,.18); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 13px/1.45 'IBM Plex Mono', ui-monospace, Consolas, monospace; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
header { position: fixed; top: 24px; left: 24px; right: 24px; pointer-events: none; }
h1 { font: 400 clamp(36px, 6vw, 72px)/.95 'Fraunces', Georgia, serif; letter-spacing: -.02em; }
h1 em { color: var(--seal); }
.sub { margin-top: 8px; color: var(--dim); max-width: 34ch; }
.facts { position: fixed; top: 28px; right: 24px; text-align: right; pointer-events: none; }
.facts b { display: block; font: italic 400 clamp(22px, 3vw, 32px)/1.1 'Fraunces', Georgia, serif; }
.facts span { color: var(--dim); }
.panel { position: fixed; left: 50%; bottom: 20px; translate: -50% 0; width: min(640px, calc(100% - 32px));
  background: rgba(243,238,227,.9); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 10px; backdrop-filter: blur(6px); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row label { min-width: 7ch; color: var(--dim); }
button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--ink); padding: 8px 12px; min-height: 40px; cursor: pointer; }
button:hover { background: var(--ink); color: var(--paper); }
button.go { border-color: var(--seal); color: var(--seal); margin-left: auto; }
button.go:hover { background: var(--seal); color: var(--paper); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
#n { min-width: 2ch; text-align: center; font-size: 16px; }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--seal); height: 32px; }
.ticks { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; padding-left: calc(7ch + 10px); }
.seal { position: fixed; right: 24px; top: 120px; width: 74px; height: 74px; display: grid; place-items: center; text-align: center;
  background: var(--seal); color: var(--paper); font: 400 13px/1.05 'Fraunces', Georgia, serif; letter-spacing: .08em;
  transform: rotate(-6deg) scale(.6); opacity: 0; transition: opacity .4s, transform .4s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.seal.on { opacity: .92; transform: rotate(-6deg) scale(1); }
.sub.dragon { color: var(--seal); }
@media (max-width: 640px) {
  .facts { position: static; text-align: left; margin-top: 6px; }
  .facts b { display: inline; font-size: 18px; }
  .facts span { display: block; font-size: 11px; }
  header { left: 16px; top: 16px; }
  .seal { top: 110px; right: 16px; width: 60px; height: 60px; font-size: 11px; }
  .ticks { padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .seal { transition: opacity .4s; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A strip of paper drawn from its fold creases"></canvas>
<header id="head">
  <h1>Paper <em>Dragon</em></h1>
  <p class="sub" id="sub" aria-live="polite">Fold a strip in half, again and again. Then open every crease to exactly 90°.</p>
  <div class="facts" id="facts"><b id="layers">1,024 layers</b> <span id="thick">10.2 cm thick</span></div>
</header>
<div class="seal" id="seal" aria-hidden="true">DRAGON<br>CURVE</div>

<div class="panel" id="panel">
  <div class="row">
    <label>folds</label>
    <button id="less" aria-label="One fold fewer">−</button>
    <span id="n" aria-live="polite">10</span>
    <button id="more" aria-label="One fold more">+</button>
    <button class="go" id="go">Unfold to 90°</button>
  </div>
  <div class="row">
    <label for="angle">opening</label>
    <input id="angle" type="range" min="0" max="180" step="0.5" value="180">
  </div>
  <div class="ticks" aria-hidden="true"><span>0° flat strip</span><span>90° dragon</span><span>180° folded</span></div>
</div>

<script src="lib.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let n = 10, turns = creases(n), deg = 180, anim = null, W, H, dpr;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; draw();
}

// Ink fades from indigo to vermilion along the strip, so you can follow it.
const A = [35, 48, 90], B = [210, 65, 43];
const mix = t => `rgb(${A.map((a, i) => Math.round(a + (B[i] - a) * t)).join(',')})`;

function draw() {
  const pts = strip(turns, deg * Math.PI / 180), m = pts.length / 2;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const copies = tiles ? 4 : 1;
  // copy k is the same strip turned k quarter-turns around the start point
  const X = (k, x, y) => [x, -y, -x, y][k], Y = (k, x, y) => [y, x, -y, -x][k];
  for (let k = 0; k < copies; k++) for (let i = 0; i < pts.length; i += 2) {
    const x = X(k, pts[i], pts[i + 1]), y = Y(k, pts[i], pts[i + 1]);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  // fit between the real header and panel, whatever the screen size
  const top = Math.max($('sub').getBoundingClientRect().bottom, W < 640 ? $('facts').getBoundingClientRect().bottom : 0) + 16;
  const bottom = H - $('panel').getBoundingClientRect().top + 16;
  const s = Math.max(0.01, Math.min((W - 64) / Math.max(x1 - x0, 1), (H - top - bottom) / Math.max(y1 - y0, 1)));
  const ox = W / 2 - (x0 + x1) / 2 * s, oy = top + (H - top - bottom) / 2 - (y0 + y1) / 2 * s;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.lineCap = g.lineJoin = 'round';
  g.lineWidth = Math.max(0.6, Math.min(3, s * 0.35));
  const chunks = 48, per = Math.ceil((m - 1) / chunks);
  for (let k = 0; k < copies; k++) for (let c = 0; c < chunks; c++) {
    const a = c * per, b = Math.min(m - 1, a + per);
    if (a >= b) break;
    g.strokeStyle = tiles ? TILE[k] : mix(c / (chunks - 1));
    g.beginPath(); g.moveTo(ox + X(k, pts[a * 2], pts[a * 2 + 1]) * s, oy + Y(k, pts[a * 2], pts[a * 2 + 1]) * s);
    for (let i = a + 1; i <= b; i++) g.lineTo(ox + X(k, pts[i * 2], pts[i * 2 + 1]) * s, oy + Y(k, pts[i * 2], pts[i * 2 + 1]) * s);
    g.stroke();
  }
  const dragon = Math.abs(deg - 90) < 0.75;
  $('seal').classList.toggle('on', dragon);
  const sub = $('sub');
  if (sub.classList.contains('dragon') !== dragon) {
    sub.classList.toggle('dragon', dragon);
    sub.textContent = dragon ? 'Every crease at 90°. The strip never crosses itself or repeats an edge.' : 'Fold a strip in half, again and again. Then open every crease to exactly 90°.';
  }
}

// ??? — four dragons, one per quarter-turn, fit together with no gaps and no overlaps
const TILE = ['#23305a', '#d2412b', '#c99a2e', '#5d7f6a'];
let tiles = false, typed = '';

function setFolds(k) {
  n = Math.max(1, Math.min(16, k)); turns = creases(n);
  const layers = 2 ** n, cm = layers * 0.01; // printer paper is about 0.1 mm thick
  $('n').textContent = n;
  $('layers').textContent = layers.toLocaleString('en-US') + ' layers';
  $('thick').textContent = (cm >= 100 ? (cm / 100).toFixed(1) + ' m' : cm >= 1 ? cm.toFixed(1) + ' cm' : (cm * 10).toFixed(1) + ' mm') + ' thick if it were real paper';
  draw();
}
function setDeg(d) { deg = Math.max(0, Math.min(180, d)); $('angle').value = deg; $('angle').setAttribute('aria-valuetext', deg + ' degrees'); draw(); }

// Ease the opening angle to a target; reduced motion jumps straight there.
function animateTo(target, ms = 3200) {
  cancelAnimationFrame(anim);
  if (calm) return setDeg(target);
  const from = deg, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, Math.max(0, (now - t0) / ms)), e = 1 - Math.pow(1 - k, 3);
    setDeg(from + (target - from) * e);
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

$('less').onclick = () => setFolds(n - 1);
$('more').onclick = () => setFolds(n + 1);
$('go').onclick = () => animateTo(90);
$('angle').oninput = e => { cancelAnimationFrame(anim); setDeg(+e.target.value); };
addEventListener('keydown', e => {
  if (e.key.length === 1) { typed = (typed + e.key.toLowerCase()).slice(-4); if (typed === 'tile') { typed = ''; tiles = !tiles; draw(); } }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowUp') setFolds(n + 1);
  else if (e.key === 'ArrowDown') setFolds(n - 1);
  else if (e.key === 'ArrowLeft') setDeg(deg - 1);
  else if (e.key === 'ArrowRight') setDeg(deg + 1);
  else if (e.code === 'Space') { e.preventDefault(); animateTo(deg === 90 ? 180 : 90); }
});
addEventListener('resize', resize);
resize(); setFolds(10);
</script>
</body>
</html>
